
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UMITAN NEWS LAB03</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: linear-gradient(160deg, #e7f8ff, #f7fbff);
    color: #17364d;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
  }
  header {
    background: linear-gradient(120deg, #126c9c, #23a9c4);
    color: white;
    padding: 28px 20px;
    text-align: center;
  }
  h1 { font-size: 24px; margin: 0 0 8px; }
  header p { margin: 0; font-size: 13px; opacity: .9; }
  main { max-width: 720px; margin: auto; padding: 20px 14px 50px; }
  .intro, .status {
    background: white;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
    line-height: 1.7;
  }
  .status { font-size: 13px; color: #52758a; }
  .article {
    display: block;
    background: white;
    border-radius: 16px;
    padding: 17px;
    margin-bottom: 12px;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 3px 12px #19577a12;
  }
  .article:active { background: #eaf7ff; }
  .number { font-size: 12px; color: #168bb1; font-weight: bold; }
  .article h2 { font-size: 16px; line-height: 1.6; margin: 8px 0; }
  .meta { font-size: 12px; color: #718797; line-height: 1.6; }
  .open { color: #087eb1; font-size: 13px; margin-top: 10px; }
  button {
    border: 0;
    border-radius: 20px;
    background: #087da8;
    color: white;
    padding: 10px 18px;
    font-size: 14px;
  }
  .actions { text-align: center; margin: 20px 0; }
</style>
</head>
<body>

<header>
  <h1>📰 UMITAN NEWS LAB03</h1>
  <p>海上保安庁ニュース・自動取得実験</p>
</header>

<main>
  <div class="intro">
    💙 めいめい、海上保安庁に関するニュースを集めてきたよ！<br>
    気になる記事をタップすると、元の記事を開けるよ。
  </div>

  <div id="status" class="status">🔄 ニュースを読み込み中...</div>
  <div id="articles"></div>

  <div class="actions">
    <button onclick="loadNews()">🔄 ニュースを再読み込み</button>
  </div>
</main>

<script>
async function loadNews() {
  const status = document.getElementById("status");
  const container = document.getElementById("articles");

  status.textContent = "🔄 ニュースを読み込み中...";
  container.replaceChildren();

  try {
    const response = await fetch(
      "./news.json?t=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();
    const articles = data.topics?.["海上保安庁"];

    if (!Array.isArray(articles)) {
      throw new Error("海上保安庁のデータが見つかりません");
    }

    const latest = articles.slice(0, 10);

    const updated = data.updated_at
      ? new Date(data.updated_at).toLocaleString("ja-JP")
      : "不明";

    status.textContent =
      "✅ " + latest.length + "件取得 ｜ データ更新：" + updated;

    if (latest.length === 0) {
      container.textContent = "現在、表示できるニュースがないよ。";
      return;
    }

    latest.forEach((article, index) => {
      const card = document.createElement("a");
      card.className = "article";

      const url = article.link || "";
      if (/^https?:\/\//i.test(url)) {
        card.href = url;
        card.target = "_blank";
        card.rel = "noopener noreferrer";
      }

      const number = document.createElement("div");
      number.className = "number";
      number.textContent = "NEWS " + String(index + 1).padStart(2, "0");

      const title = document.createElement("h2");
      title.textContent = article.title || "タイトルなし";

      const meta = document.createElement("div");
      meta.className = "meta";

      let date = article.date || "日付不明";
      const parsed = new Date(date);
      if (!isNaN(parsed.getTime())) {
        date = parsed.toLocaleString("ja-JP");
      }

      meta.textContent =
        "📅 " + date + " ｜ " + (article.source || "情報源不明");

      const open = document.createElement("div");
      open.className = "open";
      open.textContent = card.href
        ? "記事を読む →"
        : "記事リンクなし";

      card.append(number, title, meta, open);
      container.appendChild(card);
    });

  } catch (error) {
    status.textContent = "⚠️ ニュースを読み込めなかったよ";
    container.textContent = "詳細：" + error.message;
  }
}

loadNews();
</script>

</body>
</html>
