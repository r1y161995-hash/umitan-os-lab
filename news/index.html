
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UMITAN NEWS LAB05.1</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{
 margin:0;
 font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
 color:#fff;
 overflow:hidden;
 background:#102c48;
}
.scene{
 position:fixed;inset:0;
 background:
 radial-gradient(ellipse at 80% 18%,#81d5dc88,transparent 38%),
 linear-gradient(160deg,#123653 0%,#216b85 49%,#0a304b 100%);
}
.scene:after{
 content:"";
 position:absolute;left:0;right:0;bottom:0;height:37%;
 background:linear-gradient(180deg,transparent,#08243d88);
}
.header{
 position:absolute;top:env(safe-area-inset-top,0px);
 left:0;right:0;
 padding:22px 20px 10px;
 text-align:center;
 z-index:1;
}
.header h1{
 margin:0;font-size:22px;letter-spacing:2px;
 text-shadow:0 2px 12px #08243d;
}
.header small{color:#d2f3f5;font-size:11px}
.character{
 position:absolute;top:16%;left:0;right:0;
 text-align:center;z-index:1;
 pointer-events:none;
}
.character .symbol{
 font-size:60px;
 filter:drop-shadow(0 5px 15px #002b49);
}
.character .name{
 margin-top:4px;font-size:12px;
 letter-spacing:3px;color:#dcffff;
}
.character .speech{
 display:inline-block;
 margin-top:12px;
 padding:9px 16px;
 border:1px solid #ffffff66;
 border-radius:18px;
 background:#0b466d99;
 font-size:13px;
}
.panel{
 position:fixed;
 top:43dvh;
 left:12px;right:12px;
 height:54dvh;
 max-height:720px;
 z-index:5;
 display:flex;flex-direction:column;
 overflow:hidden;
 border:1px solid #b7f4ff80;
 border-radius:22px;
 background:rgba(9,38,65,.92);
 box-shadow:0 12px 40px #001b32aa;
 backdrop-filter:blur(18px);
 -webkit-backdrop-filter:blur(18px);
}
.drag-handle{
 flex-shrink:0;
 padding:11px 14px 12px;
 text-align:center;
 cursor:grab;
 touch-action:none;
 user-select:none;
 -webkit-user-select:none;
 border-bottom:1px solid #ffffff25;
}
.grip{
 width:44px;height:4px;border-radius:10px;
 background:#a8dbe5;margin:0 auto 10px;
}
.panel-heading{
 display:flex;justify-content:space-between;
 align-items:center;gap:10px;
}
.panel-heading strong{font-size:15px}
button{
 border:1px solid #88dbe9;
 background:#185a76;
 color:white;
 border-radius:12px;
 padding:7px 12px;
 font-size:12px;
 cursor:pointer;
}
button:disabled{opacity:.5}
.meta{
 padding:9px 16px;
 font-size:11px;
 color:#b8dce8;
 border-bottom:1px solid #ffffff16;
}
.news-list{
 flex:1;min-height:0;
 overflow-y:auto;
 overscroll-behavior:contain;
 -webkit-overflow-scrolling:touch;
 padding:10px 12px 22px;
}
.news-item{
 display:block;
 margin-bottom:10px;
 padding:13px;
 border:1px solid #8ccbe633;
 border-radius:14px;
 background:#ffffff0c;
 color:white;
 text-decoration:none;
}
.news-item:active{background:#ffffff22}
.news-number{
 font-size:10px;
 color:#8ce3ed;
 margin-bottom:6px;
}
.news-title{
 font-size:14px;
 font-weight:600;
 line-height:1.6;
 overflow-wrap:anywhere;
}
.news-source{
 margin-top:8px;
 font-size:11px;
 color:#b6d4e2;
}
.status{
 text-align:center;
 padding:35px 12px;
 color:#d5e9ef;
 font-size:13px;
 line-height:1.8;
}
.footer{
 flex-shrink:0;
 text-align:center;
 padding:7px 12px max(9px,env(safe-area-inset-bottom));
 border-top:1px solid #ffffff18;
 font-size:10px;
 color:#9cc9d6;
}
</style>
</head>
<body>
<div class="scene"></div>

<header class="header">
 <h1>UMITAN NEWS</h1>
 <small>NEWS LAB05.1 · STANDALONE TEST</small>
</header>

<div class="character">
 <div class="symbol">🐚</div>
 <div class="name">UMITAN</div>
 <div class="speech">めいめい、今日のニュースを見てみよう💙</div>
</div>

<section class="panel" id="panel">
 <div class="drag-handle" id="dragHandle">
  <div class="grip"></div>
  <div class="panel-heading">
   <strong>📰 海上保安庁 関連ニュース</strong>
   <button id="reloadButton" type="button">更新 ↻</button>
  </div>
 </div>
 <div class="meta" id="meta">ニュースを読み込み中...</div>
 <div class="news-list" id="newsList">
  <div class="status">🌊 ニュースを取得しています...</div>
 </div>
 <div class="footer">UMITAN NEWS LAB05.1 · ウィンドウ上部をドラッグできます</div>
</section>

<script>
const panel=document.getElementById("panel");
const handle=document.getElementById("dragHandle");
const list=document.getElementById("newsList");
const meta=document.getElementById("meta");
const reload=document.getElementById("reloadButton");

function formatDate(value){
 if(!value)return "日時不明";
 const d=new Date(value);
 if(Number.isNaN(d.getTime()))return String(value);
 return new Intl.DateTimeFormat("ja-JP",{
  timeZone:"Asia/Tokyo",
  month:"numeric",day:"numeric",
  hour:"2-digit",minute:"2-digit"
 }).format(d);
}

function showStatus(message){
 list.replaceChildren();
 const div=document.createElement("div");
 div.className="status";
 div.textContent=message;
 list.appendChild(div);
}

function addNews(item,index){
 const title=String(item.title||"タイトルなし");
 const source=String(item.source||"配信元不明");
 const date=formatDate(item.date);
 let url=null;
 try{
  const parsed=new URL(item.link);
  if(["https:","http:"].includes(parsed.protocol)){
   url=parsed.href;
  }
 }catch(e){}

 const card=document.createElement(url?"a":"div");
 card.className="news-item";
 if(url){
  card.href=url;
  card.target="_blank";
  card.rel="noopener noreferrer";
 }

 const number=document.createElement("div");
 number.className="news-number";
 number.textContent="NEWS "+String(index+1).padStart(2,"0");

 const heading=document.createElement("div");
 heading.className="news-title";
 heading.textContent=title;

 const detail=document.createElement("div");
 detail.className="news-source";
 detail.textContent=source+" · "+date+(url?" ↗":"");

 card.append(number,heading,detail);
 list.appendChild(card);
}

async function loadNews(){
 reload.disabled=true;
 meta.textContent="データを確認中...";
 showStatus("🌊 ニュースを読み込み中...");

 try{
  const response=await fetch(
   "./news.json?ts="+Date.now(),
   {cache:"no-store"}
  );
  if(!response.ok){
   throw new Error("HTTP "+response.status);
  }

  const data=await response.json();
  const items=data.topics?.["海上保安庁"];

  if(!Array.isArray(items)){
   throw new Error("海上保安庁のデータが見つかりません");
  }

  list.replaceChildren();
  const news=items.slice(0,10);

  if(news.length===0){
   showStatus("現在、表示できるニュースはありません。");
  }else{
   news.forEach(addNews);
  }

  meta.textContent=
   news.length+"件表示 · データ更新 "+formatDate(data.updated_at);
  list.scrollTop=0;

 }catch(error){
  meta.textContent="読み込みエラー";
  showStatus(
   "ニュースを取得できませんでした。\n"+
   "news.jsonの配置を確認してね。\n"+
   error.message
  );
 }finally{
  reload.disabled=false;
 }
}

reload.addEventListener("click",loadNews);

// ウィンドウのドラッグ移動
let drag=null;

handle.addEventListener("pointerdown",event=>{
 if(event.target.closest("button"))return;
 drag={
  pointerId:event.pointerId,
  startY:event.clientY,
  top:panel.getBoundingClientRect().top
 };
 handle.setPointerCapture(event.pointerId);
});

handle.addEventListener("pointermove",event=>{
 if(!drag||event.pointerId!==drag.pointerId)return;
 const delta=event.clientY-drag.startY;
 const minTop=70;
 const maxTop=Math.max(minTop,window.innerHeight-160);
 const next=Math.min(maxTop,Math.max(minTop,drag.top+delta));
 panel.style.top=next+"px";
});

function endDrag(){drag=null;}
handle.addEventListener("pointerup",endDrag);
handle.addEventListener("pointercancel",endDrag);

loadNews();
</script>
</body>
</html>
