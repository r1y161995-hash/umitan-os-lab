
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UMITAN NEWS LAB05</title>
<style>
* { box-sizing:border-box; }
html,body {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}
body { background:#103d68; color:#173b5a; }

#scene {
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#103d68;
}
#background {
  position:absolute;
  inset:0;
  background-image:url("./news_bg.png");
  background-repeat:no-repeat;
  background-size:auto 100%;
  background-position:50% 50%;
}

#window {
  position:absolute;
  left:3%;
  right:3%;
  bottom:2%;
  height:42%;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.8);
  border-radius:20px;
  background:rgba(238,248,255,.91);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  box-shadow:0 8px 35px #082b5370;
}

#windowHeader {
  padding:12px 14px;
  background:rgba(255,255,255,.6);
  border-bottom:1px solid #b8d5e6;
  flex-shrink:0;
}
#windowHeader strong {
  font-size:15px;
  color:#145a84;
}
#message {
  font-size:12px;
  line-height:1.5;
  margin-top:5px;
}
#status {
  font-size:10px;
  color:#58788b;
  margin-top:5px;
}

#newsList {
  flex:1;
  overflow-y:auto;
  padding:10px;
  -webkit-overflow-scrolling:touch;
}

.article {
  display:block;
  background:rgba(255,255,255,.88);
  padding:12px;
  border-radius:12px;
  margin-bottom:9px;
  color:#173b5a;
  text-decoration:none;
}
.article:active { background:#d8efff; }
.article .num {
  font-size:10px;
  color:#1386ae;
  font-weight:bold;
}
.article h2 {
  font-size:13px;
  line-height:1.5;
  margin:5px 0;
}
.article .meta {
  font-size:10px;
  color:#73899a;
  line-height:1.5;
}
.article .read {
  font-size:11px;
  color:#0783af;
  margin-top:6px;
}

#controls {
  position:absolute;
  top:10px;
  left:10px;
  max-width:215px;
  padding:10px;
  border-radius:12px;
  background:rgba(7,42,77,.78);
  color:white;
  font-size:11px;
  z-index:5;
}
#controls label {
  display:block;
  margin:7px 0 3px;
}
#controls input {
  width:100%;
  accent-color:#63d3e8;
}
#controls button {
  margin-top:8px;
  border:0;
  padding:7px 10px;
  border-radius:9px;
  background:#59b8d3;
  color:#08304c;
  font-weight:bold;
}
#toggle {
  position:absolute;
  top:10px;
  left:10px;
  z-index:6;
  border:0;
  border-radius:10px;
  padding:8px 11px;
  background:#0b3c67dd;
  color:white;
  font-size:11px;
  display:none;
}
</style>
</head>
<body>

<div id="scene">
  <div id="background"></div>

  <div id="window">
    <div id="windowHeader">
      <strong>📰 UMITAN NEWS · LAB05</strong>
      <div id="message">
        めいめい、今日のニュースを確認しているよ！💙
      </div>
      <div id="status">読み込み中...</div>
    </div>
    <div id="newsList"></div>
  </div>

  <div id="controls">
    <strong>🔬 LAB05 表示調整</strong>

    <label>背景の左右位置</label>
    <input id="posX" type="range" min="0" max="100" value="50">

    <label>背景の上下位置</label>
    <input id="posY" type="range" min="0" max="100" value="50">

    <label>背景の拡大率</label>
    <input id="zoom" type="range" min="100" max="180" value="100">

    <label>ニュースウィンドウの高さ</label>
    <input id="height" type="range" min="25" max="75" value="42">

    <button id="hide">調整パネルを閉じる</button>
  </div>

  <button id="toggle">⚙️ 表示調整</button>
</div>

<script>
const bg = document.getElementById("background");
const win = document.getElementById("window");

const posX = document.getElementById("posX");
const posY = document.getElementById("posY");
const zoom = document.getElementById("zoom");
const height = document.getElementById("height");

function updateLayout() {
  bg.style.backgroundPosition =
    posX.value + "% " + posY.value + "%";
  bg.style.backgroundSize =
    "auto " + zoom.value + "%";
  win.style.height = height.value + "%";
}

[posX,posY,zoom,height].forEach(input => {
  input.addEventListener("input",updateLayout);
});

updateLayout();

const controls = document.getElementById("controls");
const toggle = document.getElementById("toggle");

document.getElementById("hide").onclick = () => {
  controls.style.display = "none";
  toggle.style.display = "block";
};

toggle.onclick = () => {
  controls.style.display = "block";
  toggle.style.display = "none";
};

function formatDate(value) {
  const d = new Date(value);
  if (isNaN(d.getTime())) return value || "不明";
  return d.toLocaleString("ja-JP",{
    timeZone:"Asia/Tokyo",
    month:"numeric",
    day:"numeric",
    hour:"2-digit",
    minute:"2-digit"
  });
}

function safeUrl(value) {
  try {
    const u = new URL(value);
    if (u.protocol === "https:" ||
        u.protocol === "http:") return u.href;
  } catch(e) {}
  return null;
}

async function loadNews() {
  const message = document.getElementById("message");
  const status = document.getElementById("status");
  const list = document.getElementById("newsList");

  try {
    const response = await fetch(
      "./news.json?t=" + Date.now(),
      {cache:"no-store"}
    );
    if (!response.ok) throw new Error("HTTP "+response.status);

    const data = await response.json();
    const news = data.topics?.["海上保安庁"];

    if (!Array.isArray(news)) {
      throw new Error("ニュースデータがありません");
    }

    const items = news.slice(0,10);
    const fragment = document.createDocumentFragment();

    items.forEach((article,index) => {
      const card = document.createElement("a");
      card.className = "article";

      const url = safeUrl(article.link);
      if (url) {
        card.href = url;
        card.target = "_blank";
        card.rel = "noopener noreferrer";
      }

      const num = document.createElement("div");
      num.className = "num";
      num.textContent =
        "NEWS "+String(index+1).padStart(2,"0");

      const title = document.createElement("h2");
      title.textContent = article.title || "タイトルなし";

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent =
        formatDate(article.date)+" ｜ "+
        (article.source || "情報源不明");

      const read = document.createElement("div");
      read.className = "read";
      read.textContent = url
        ? "記事を読む →"
        : "記事リンクなし";

      card.append(num,title,meta,read);
      fragment.appendChild(card);
    });

    list.replaceChildren(fragment);

    message.textContent =
      "めいめい、ニュースを"+items.length+
      "件お届けするね！💙";

    status.textContent =
      "データ更新："+formatDate(data.updated_at);

  } catch(error) {
    message.textContent =
      "めいめい、ごめんね。ニュースを確認できなかったよ。";
    status.textContent = "⚠️ "+error.message;
  }
}

loadNews();
setInterval(loadNews,15*60*1000);
</script>
</body>
</html>
