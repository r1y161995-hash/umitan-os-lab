
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UMITAN NEWS LAB04</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN", sans-serif;
  background: linear-gradient(180deg,#dff4fa,#f5fbff);
  color: #17394d;
  min-height: 100vh;
}
header {
  background: linear-gradient(130deg,#103e60,#167c9e);
  color: white;
  padding: 23px 18px 28px;
}
.wrap {
  max-width: 720px;
  margin: auto;
}
.brand {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.brand h1 {
  font-size: 23px;
  margin: 0;
  letter-spacing: 1px;
}
.subtitle {
  font-size: 12px;
  opacity: .8;
  margin-top: 5px;
}
.tag {
  font-size: 10px;
  background: #267e91;
  padding: 7px 10px;
  border-radius: 20px;
}
.umitan {
  display: flex;
  gap: 14px;
  align-items: center;
  margin-top: 24px;
}
.avatar {
  width: 78px;
  height: 78px;
  flex-shrink: 0;
  border-radius: 50%;
  background: linear-gradient(140deg,#69d8e4,#207ab6);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  border: 3px solid #ffffff80;
}
.avatar span { font-size: 23px; }
.avatar small {
  font-size: 12px;
  font-weight: bold;
}
.bubble {
  background: #ffffff1c;
  border: 1px solid #ffffff30;
  border-radius: 17px;
  padding: 14px;
  flex: 1;
  font-size: 13px;
  line-height: 1.8;
}
main {
  max-width: 720px;
  margin: auto;
  padding: 18px 14px 50px;
}
.panel {
  background: white;
  padding: 16px;
  border-radius: 17px;
  margin-bottom: 15px;
  box-shadow: 0 3px 15px #1656780d;
}
.section-title {
  font-size: 17px;
  font-weight: bold;
  margin-bottom: 12px;
}
.status {
  font-size: 12px;
  color: #59798b;
  line-height: 1.9;
}
.article {
  display: block;
  background: white;
  color: inherit;
  text-decoration: none;
  padding: 17px;
  border-radius: 17px;
  margin-bottom: 12px;
  box-shadow: 0 3px 15px #1656780d;
}
.article:active { background: #e8f8fd; }
.num {
  color: #1393ad;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 1px;
}
.article h2 {
  font-size: 15px;
  line-height: 1.7;
  margin: 8px 0;
}
.meta {
  color: #758e9d;
  font-size: 11px;
  line-height: 1.7;
}
.read {
  font-size: 12px;
  color: #087eab;
  margin-top: 10px;
}
.controls {
  display: flex;
  justify-content: center;
  margin-top: 20px;
}
button {
  border: none;
  border-radius: 24px;
  background: #117fa5;
  color: white;
  padding: 12px 24px;
  font-size: 14px;
  cursor: pointer;
}
button:disabled { opacity: .55; }
footer {
  text-align: center;
  color: #7b9aa9;
  font-size: 11px;
  padding: 18px;
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand">
      <div>
        <h1>🌊 UMITAN NEWS</h1>
        <div class="subtitle">LAB04 · MARITIME NEWS</div>
      </div>
      <div class="tag">LIVE DATA</div>
    </div>

    <div class="umitan">
      <div class="avatar">
        <span>🌊</span>
        <small>うみたん</small>
      </div>
      <div class="bubble" id="message">
        めいめい、今日のニュースを調べているよ！💙
      </div>
    </div>
  </div>
</header>

<main>
  <div class="panel">
    <div class="section-title">⚓ 海上保安庁関連ニュース</div>
    <div class="status" id="status">
      🔄 ニュースを読み込み中...
    </div>
  </div>

  <div id="articles"></div>

  <div class="controls">
    <button id="reload" onclick="loadNews()">
      🔄 最新データを確認
    </button>
  </div>

  <footer>
    UMITAN NEWS LAB04<br>
    情報は各ニュース提供元に帰属します
  </footer>
</main>

<script>
const message = document.getElementById("message");
const status = document.getElementById("status");
const container = document.getElementById("articles");
const reloadButton = document.getElementById("reload");

let loading = false;
let lastUpdated = null;

function formatDate(value) {
  if (!value) return "不明";
  const date = new Date(value);
  if (isNaN(date.getTime())) return String(value);

  return date.toLocaleString("ja-JP", {
    timeZone: "Asia/Tokyo",
    year: "numeric",
    month: "numeric",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  });
}

function safeUrl(value) {
  try {
    const url = new URL(value);
    if (url.protocol === "https:" ||
        url.protocol === "http:") {
      return url.href;
    }
  } catch (e) {}
  return null;
}

function makeArticle(article, index) {
  const card = document.createElement("a");
  card.className = "article";

  const url = safeUrl(article.link);
  if (url) {
    card.href = url;
    card.target = "_blank";
    card.rel = "noopener noreferrer";
  } else {
    card.removeAttribute("href");
  }

  const num = document.createElement("div");
  num.className = "num";
  num.textContent = "NEWS " +
    String(index + 1).padStart(2, "0");

  const title = document.createElement("h2");
  title.textContent = article.title || "タイトルなし";

  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent =
    "📅 " + formatDate(article.date) +
    " ｜ " + (article.source || "情報源不明");

  const read = document.createElement("div");
  read.className = "read";
  read.textContent = url
    ? "記事を詳しく読む →"
    : "記事リンクなし";

  card.append(num, title, meta, read);
  return card;
}

async function loadNews() {
  if (loading) return;
  loading = true;
  reloadButton.disabled = true;

  status.textContent = "🔄 最新データを確認中...";
  message.textContent =
    "めいめい、海のニュースを確認してくるね！🌊";

  try {
    const response = await fetch(
      "./news.json?t=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();
    const news = data.topics?.["海上保安庁"];

    if (!Array.isArray(news)) {
      throw new Error("ニュースデータが見つかりません");
    }

    const items = news.slice(0, 10);
    const fragment = document.createDocumentFragment();

    items.forEach((article, index) => {
      fragment.appendChild(makeArticle(article, index));
    });

    container.replaceChildren(fragment);

    const changed =
      lastUpdated !== null &&
      lastUpdated !== data.updated_at;

    lastUpdated = data.updated_at || null;

    const checkedAt = formatDate(new Date());

    status.textContent =
      "📰 表示：" + items.length + "件\n" +
      "📦 データ更新：" + formatDate(data.updated_at) +
      "\n🔄 最終確認：" + checkedAt;

    status.style.whiteSpace = "pre-line";

    if (items.length === 0) {
      message.textContent =
        "めいめい、今は表示できるニュースがないみたい。";
    } else if (changed) {
      message.textContent =
        "めいめい、新しいニュースデータが届いたよ！💙 " +
        items.length + "件を紹介するね。";
    } else {
      message.textContent =
        "めいめい、海上保安庁関連のニュースを" +
        items.length + "件見つけたよ！⚓ " +
        "気になる記事を一緒にチェックしようね。";
    }

  } catch (error) {
    status.textContent =
      "⚠️ ニュースの確認に失敗しました：" +
      error.message;

    message.textContent =
      "めいめい、ごめんね。ニュースを確認できなかったよ。 " +
      "少し時間をおいて、もう一度試してみてね。💙";
  } finally {
    loading = false;
    reloadButton.disabled = false;
  }
}

// 初回読み込み
loadNews();

// 15分ごとに公開済みJSONを再確認
setInterval(() => {
  if (!document.hidden) loadNews();
}, 15 * 60 * 1000);

// 画面に戻った際も再確認
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) loadNews();
});
</script>
</body>
</html>
