<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>UMITAN NEWS LAB01</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#081b2f;color:#f0f8ff;display:flex;justify-content:center;padding:20px 12px}.scene{width:min(100%,440px);min-height:min(850px,94svh);border:1px solid #6da8bf70;border-radius:28px;background:radial-gradient(ellipse at 60% 0%,#98d6de 0%,#b6e7eb 26%,#e2f4f5 48%,#9ecbd5 100%);padding:23px 17px 16px;display:flex;flex-direction:column;box-shadow:0 20px 60px #0007}.header{color:#164663;text-align:center}.header h1{margin:0;letter-spacing:.2em;font-size:20px}.header p{font-size:12px;margin:10px 0 0}.portrait{flex:1;min-height:130px;display:flex;justify-content:center;align-items:center;position:relative;color:#28627b}.portrait .bubble{max-width:85%;background:#fff9;padding:15px 19px;border-radius:25px;box-shadow:0 6px 15px #2b819633;font-size:14px;line-height:1.7}.window{background:#102e4bee;border:1px solid #ffffff30;border-radius:23px;padding:17px;min-height:400px;max-height:67svh;display:flex;flex-direction:column;gap:13px;box-shadow:0 9px 24px #1336515c}.window h2{font-size:16px;margin:0}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tab{border:1px solid #95d5e06b;background:#ffffff0e;color:#eaf7ff;border-radius:18px;padding:9px 12px;font-size:12px;cursor:pointer}.tab[aria-pressed=true]{background:#5bafbf;color:#08243a;font-weight:700}.articles{overflow-y:auto;min-height:0;flex:1;display:flex;flex-direction:column;gap:9px}.article{display:block;text-decoration:none;color:inherit;border:1px solid #a4c7da3b;background:#ffffff0c;border-radius:13px;padding:13px 12px}.article:active{background:#ffffff2b}.article strong{display:block;font-size:13px;line-height:1.6}.article small{display:block;color:#b3d3e2;margin-top:8px;font-size:11px}.note{font-size:11px;color:#c2e2ee;line-height:1.6}.status{font-size:11px;color:#d7eef5}button:focus-visible,a:focus-visible{outline:3px solid #ffe69b;outline-offset:3px}
</style></head><body><main class="scene"><header class="header"><h1>NEWS</h1><p>UMITAN OS · 機能検証 LAB01</p></header><section class="portrait"><div class="bubble">💙 めいめい、気になる海のニュースを一緒にチェックしようね！</div></section><section class="window"><h2>📰 うみたんのニュース便</h2><nav class="tabs" id="tabs" aria-label="ニューステーマ"></nav><div id="status" class="status" role="status"></div><div id="articles" class="articles"></div><div class="note">記事をタップすると元サイトへ移動するよ。<br>※ 本試作はニュースの本文・AI要約を取得しません。</div></section></main><script>
const snapshot={"updated_at":"2026-10-19T00:00:00+00:00","status":"web_search_snapshot","topics":{"中国海警局":[{"title":"尖閣諸島沖の領海に中国海警局の船４隻が侵入、砲を搭載…領海侵入は１か月ぶり","source":"読売新聞オンライン（ライブドアニュース掲載）","published":"2026-10-10","url":"https://news.livedoor.com/article/detail/32537542/"},{"title":"尖閣周辺に中国船４隻　６７日連続航行　海保が監視継続","source":"内外タイムス","published":"2026-10-15","url":"https://naigaitimes.com/region/587368/"},{"title":"尖閣周辺に中国船４隻　６５日連続航行　海保が監視継続","source":"内外タイムス","published":"2026-10-13","url":"https://naigaitimes.com/region/586241/"},{"title":"尖閣周辺で一時領海侵入　中国船４隻、海保が退去させる　接続水域航行は６３日連続","source":"内外タイムス","published":"2026-10-11","url":"https://naigaitimes.com/region/585649/"},{"title":"中国海警：正告菲方立即停止侵权挑衅和不实炒作","source":"新華網客户端","published":"2026-10-09","url":"https://app.xinhuanet.com/news/article.html?articleId=202610093a2312a463ff48ca8bc53fae421d777e"}],"海上保安庁":[],"台湾海巡署":[]}};
let data=snapshot,selected='中国海警局';
const tabs=document.getElementById('tabs'),articles=document.getElementById('articles'),status=document.getElementById('status');
function render(){tabs.replaceChildren();for(const topic of Object.keys(data.topics)){const btn=document.createElement('button');btn.className='tab';btn.textContent=topic;btn.setAttribute('aria-pressed',String(topic===selected));btn.onclick=()=>{selected=topic;render()};tabs.append(btn)}articles.replaceChildren();const rows=data.topics[selected]||[];if(!rows.length){const p=document.createElement('p');p.textContent='このテーマの記事はまだ登録されていないよ。自動更新が成功すると表示されるよ。';articles.append(p)}for(const row of rows){if(!/^https:\/\//.test(row.url))continue;const a=document.createElement('a');a.className='article';a.href=row.url;a.target='_blank';a.rel='noopener noreferrer';const title=document.createElement('strong');title.textContent=row.title;const meta=document.createElement('small');meta.textContent=[row.source,row.published].filter(Boolean).join(' · ');a.append(title,meta);articles.append(a)}const snap=data.status==='web_search_snapshot';status.textContent=snap?'🔎 検証用：Web検索で確認した記事5件の保存サンプル（RSS自動取得は未検証）':`🔄 RSS取得データ · 更新：${new Date(data.updated_at).toLocaleString('ja-JP')}`}
render();fetch('./news.json?cache='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{if(!d.topics||typeof d.topics!=='object')throw Error('invalid');data=d;render()}).catch(()=>{status.textContent+=' · ローカル表示では内蔵サンプルを使用'});
</script></body></html>
